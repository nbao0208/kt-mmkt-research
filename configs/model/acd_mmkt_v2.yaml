# Model Architecture Hyperparameters for ACD-MMKTv2
# Asymmetric Causal-Disentangled Multimodal Knowledge Tracing v2
model_name: "acd_mmkt_v2"
num_questions: 7652
num_kcs: 1175
d_raw_txt: 768
d_raw_img: 768
d_model: 128
num_heads: 4
max_seq_len: 200
dropout: 0.15
hgnn_layers: 2
kappa_smoothing: 10.0
beta_difficulty: 0.20
p_visual_drop: 0.15

# Modality & Ablation Flags (all true / default for full ACD-MMKTv2)
use_solution: true            # Ablation 2: false disables solution cognitive blueprint (Delta_mu_sol=0, no v_sol in d^q)
use_fine_grained: true        # Ablation 3: false uses global pooled embeddings instead of token/patch cross-attention
use_hypergraph: true          # Ablation 4: false uses standard KC lookup without HGNN
use_gram_schmidt: true        # Ablation 4: false disables Gram-Schmidt orthogonal projection (d^q = tilde_d^q)
use_deep_irt: true            # Ablation 5: false replaces monotonic 2PL-IRT with black-box MLP
use_stage1_pretrain: true     # Ablation 6: false disables Stage 1 item-bank pre-training and trains end-to-end

